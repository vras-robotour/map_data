name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

env:
  # Single ruff version for the whole repo. Keep in sync with the `ruff` pin in
  # pyproject.toml's [dev] extra and the ruff-pre-commit rev in
  # .pre-commit-config.yaml — drift between them causes reformat churn.
  RUFF_VERSION: "0.16.6"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # mypy needs the actual runtime deps installed (not just --ignore-missing-imports)
        # so it can narrow e.g. Flask's abort() as NoReturn instead of falling back to Any.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check
        run: mypy map_data/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # Coverage flags, including --cov-fail-under, come from
        # [tool.pytest.ini_options] in pyproject.toml
        run: pytest

      - name: Publish coverage summary
        # Runs even when the coverage gate fails, so the summary shows why.
        # coverage ships with pytest-cov; no third-party action or token needed.
        if: always()
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            echo
            if [ -f .coverage ]; then
              python -m coverage report --format=markdown
            else
              echo "_No coverage data produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
