name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

env:
  # Keep in sync with the ruff pin in pyproject.toml.
  RUFF_VERSION: "0.16.6"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lint
        run: uvx "ruff==${RUFF_VERSION}" check .

      - name: Check formatting
        run: uvx "ruff==${RUFF_VERSION}" format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # mypy needs the runtime deps to type Flask's abort() as NoReturn.
        run: uv sync --frozen

      - name: Type check
        run: uv run mypy map_data/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest --cov=map_data --cov-report=term-missing --cov-fail-under=72

      - name: Publish coverage summary
        # Runs even when the coverage gate fails, so the summary shows why.
        if: always()
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            echo
            if [ -f .coverage ]; then
              uv run python -m coverage report --format=markdown
            else
              echo "_No coverage data produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ros:
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      # setup_ws.sh links map_data_interfaces into <workspace>/src from here.
      - uses: actions/checkout@v5
        with:
          path: ws/src/map_data

      # Not released as a binary package; pinned to the commit the jazzy branch was tested with.
      - uses: actions/checkout@v5
        with:
          repository: Box-Robotics/ros2_numpy
          ref: d5ebf723e1d2457d36fa89bf021b212e340c3c11
          path: ws/src/ros2_numpy

      - name: Set up the workspace
        run: bash ws/src/map_data/scripts/setup_ws.sh

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # The image ships rosdep initialized but without its package index.
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ws/src --ignore-src -y --skip-keys ros2_numpy
          apt-get install -y --no-install-recommends curl python3-pytest

      - name: Build
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to map_data

      - name: Run tests
        working-directory: ws/src/map_data
        run: |
          source /opt/ros/jazzy/setup.bash
          source ../../install/setup.bash
          python3 -m pytest -q

      - name: ROS smoke test
        working-directory: ws/src/map_data
        run: |
          source /opt/ros/jazzy/setup.bash
          source ../../install/setup.bash
          bash scripts/ros_smoke.sh
