name: Demo

on:
  push:
    branches:
      - master
    paths:
      - "map_data/viewer/**"
      - "map_data/*.py"
      - "demo/**"
      - "scripts/build_static_demo.sh"
      - ".github/workflows/demo.yml"
  # Smoke-build the demo on PRs too; the deploy job stays push/dispatch-only.
  pull_request:
    branches:
      - master
    paths:
      - "map_data/viewer/**"
      - "map_data/*.py"
      - "demo/**"
      - "scripts/build_static_demo.sh"
      - ".github/workflows/demo.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # PR runs never touch gh-pages, so they get their own group instead of
  # serialising behind (and blocking) the docs/demo deploys.
  group: ${{ github.event_name == 'pull_request' && format('demo-smoke-{0}', github.ref) || 'gh-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build static demo
        run: uv run bash scripts/build_static_demo.sh

      - name: Upload static demo
        uses: actions/upload-artifact@v4
        with:
          name: static-demo
          path: _demo_out

  deploy-demo:
    needs: build-demo
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-demo
          path: _demo_out

      - name: Deploy demo to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _demo_out
          destination_dir: demo
          keep_files: true
