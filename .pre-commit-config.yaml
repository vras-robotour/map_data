repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check
        files: ^(map_data|tests)/.*\.py$
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format --check
        files: ^(map_data|tests)/.*\.py$

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy map_data
        pass_filenames: false
        files: ^map_data/.*\.py$
