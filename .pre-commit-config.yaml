repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6 # keep in sync with the ruff pin in pyproject.toml [dev]
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # Flask is needed so abort() types as NoReturn; config lives in pyproject.toml.
        additional_dependencies:
          - flask
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        files: ^map_data/
