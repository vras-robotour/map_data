osm_cloud:
  ros__parameters:
    # Frames: the Helhest field stack localises with a Fixposition GNSS/INS unit whose
    # Earth frame is FP_ECEF and whose fixed local ENU frame is FP_ENU0. In "geodetic"
    # mode the node converts UTM -> lat/lon -> ECEF and uses the FP_ECEF -> FP_ENU0 TF,
    # which is exact (a plain UTM translation is off by grid convergence, ~5-8 m/km).
    # Use transform_mode "tf" with utm_frame/local_frame on stacks that publish a UTM frame.
    utm_frame: "utm"
    local_frame: "FP_ENU0"
    earth_frame: "FP_ECEF"
    transform_mode: "geodetic"
    save_mapdata: false
    max_path_dist: 2.5
    neighbor_cost: "linear"
    grid_res: 0.4
    grid_max: [0.0, 0.0]
    grid_min: [0.0, 0.0]
    publish_intersections: true
    # Annotation store merged into mapdata_file, with route_planner's semantics:
    # "auto" = <map>.annotations.json next to the map, "none" = the unedited map, or a
    # path. The planner and this node must load the same map, or a junction on a
    # retagged or deleted way still gets a ring nothing routes over.
    # osm_cloud.launch.py forwards its annotations:= argument (default "auto") on top
    # of this file, so override it there rather than here when using the launch file.
    annotations: "auto"
    # highway= values dropped from the map: stairs are footways in OSM, but the planner
    # does not route over them, so they get no intersection rings and no road cost.
    exclude_highway: ["steps"]
    # Tag rules deciding which ways the robot may drive on (stairs, grass, bridges, ...):
    # an absolute path, or "" for the package's config/traversability.yaml. This must be
    # the same file route_planner uses, or a junction on a way the planner refuses still
    # gets a ring. osm_cloud.launch.py forwards its traversability:= argument on top of
    # this file when it is given. Read at startup only: edit the file, then restart.
    traversability_file: ""
