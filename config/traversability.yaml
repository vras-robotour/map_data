# Which OSM ways the robot may drive on, decided from their tags. Rules are tried in
# order and the FIRST matching rule wins; a way no rule matches gets `default`.
#   match: {key: value}          exact value        {key: [a, b]}  any of these values
#          {key: "*"}            tag present        several keys   all must match (AND)
#   traversable: false           the way is removed: never routed over, no intersection
#                                ring at its junctions, off-road in osm_cloud's cost cloud
#   cost: 0.5                    optional EXTRA cost, added to the highway/surface cost
#                                from planner_defaults.yaml: the graph planner weighs the
#                                way's edges (1 + way cost + this) x length. Only for tags
#                                those tables know nothing about - surfaces and highway
#                                types are already priced there, so do not repeat them.
#   reason: text                 shown in the load log next to the count of removed ways
#
# YAML reads a bare `yes` as the boolean true, but rule and tag values are both compared
# as the strings OSM uses, so `informal: yes` and `informal: "yes"` mean the same thing
# and quoting is never needed.
#
# Used by the route_planner and osm_cloud nodes (parameter `traversability_file`, empty =
# this file), by `ros2 launch ... traversability:=<file>` and by
# `map_data_plan --traversability <file>` (`--no-traversability` switches the rules off).
# A node reads the file once at startup: edit it, then restart the node.
#
# The counts below were measured on data/kralovska_obora.mapdata (Stromovka, 289 ways),
# against the two routes the robot drove there on 2026-09-08 (365 m and 751 m).

default:
  traversable: true
  cost: 0.0

rules:
  - match: {highway: steps}
    traversable: false
    reason: stairs

  - match: {surface: [grass, mud, sand]}
    traversable: false
    reason: soft surface

  # - match: {tunnel: "*"}
  #   traversable: false
  #   reason: tunnel (GNSS loss)

  - match: {highway: "cycleway"}
    traversable: false
    reason: overlap with footways - invalid intersections

  - match: {bridge: "*"}
    traversable: false
    reason: bridge

  - match: {smoothness: [bad, very_bad, horrible, very_horrible, impassable]}
    traversable: false
    reason: rough surface

  - match: {access: [no, private]}
    traversable: false
    reason: no access

  - match: {informal: "yes"}
    cost: 1.0
    reason: informal path
