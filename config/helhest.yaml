# Helhest field stack (Fixposition GNSS/INS + crl_commander, no nav2).
#
#   map_data_viewer --ros-args --params-file config/helhest.yaml
#   ros2 launch map_data osm_cloud.launch.py   (uses config/osm_grid.yaml; the osm_cloud
#                                               section below only renames topics)
#
# Every *_topic can be set to "" to disable the feature and hide its UI row.
# Topic names and types were verified against the Stromovka bags (2026-08-21, 2026-09-02).

map_data_tracker:
  ros__parameters:
    # --- geometry: paths/goals may arrive in any TF frame; they are transformed into
    #     earth_frame (ECEF) and converted to lat/lon exactly. Empty earth_frame falls back
    #     to the legacy utm_frame path.
    earth_frame: "FP_ECEF"
    utm_frame: ""

    # --- position / heading
    gps_fix_topic: "/fixposition/odometry_llh"       # NavSatFix, status 2 = RTK fixed
    gps_filtered_topic: ""                           # the Fixposition output is already fused
    stale_after: 3.0                                 # s without a fix -> STALE (marker greyed)
    trail_length: 500                                # last fixes drawn as the robot trail
    trail_min_step: 0.5                              # m moved before a fix is added to the trail
    heading_topic: "/fixposition/ypr"                # Vector3Stamped, x = yaw [rad] in FP_ENU0
    heading_type: "yaw_vector3"                      # imu | yaw_vector3 | odometry
    azimuth_topic: ""
    odom_topic: "/fixposition/odometry_enu"          # Odometry -> speed

    # --- hardware
    battery_state_topic: "/battery_state"            # sensor_msgs/BatteryState (52 V pack)
    battery_low_voltage: 46.0
    bus_voltage_topic: ""
    bus_current_topic: ""
    temperature_topic: "/temperatures"               # sensor_msgs/Temperature per motor (frame_id)
    teensy_temp_topic: ""
    odrv_error_topic: ""
    motors_enabled_topic: ""
    estop_topic: "/estop_active"                     # std_msgs/Bool
    diagnostics_topic: "/diagnostics"

    # --- navigation state
    commander_state_topic: "/crl_commander/state"    # crl_commander mode (STOP/GOTO/SEQUENCE/STUCK/...); the node publishes ~/state
    follower_state_topic: "/road_follower/state"     # robot_mission_planner road_follower (ROAD/GPS)
    bt_log_topic: ""
    speed_limit_topic: ""
    collision_monitor_state_topic: ""
    recovery_heartbeat_topic: ""
    teleop_topic: ""
    joy_topic: "/joy"                                # any stick/button -> TELEOP ACTIVE
    speak_info_topic: ""
    speak_warn_topic: ""
    speak_error_topic: "/speak/err"

    # --- geometry drawn on the map
    path_topic: "/crl_commander/plan"                # planner path (FP_ENU0), green dashed
    goal_topic: "/crl_commander/goal"                # current commander goal (FP_ENU0)
    sequence_path_topic: "/crl_commander/goal_sequence"    # loaded sequence (nav_msgs/Path, FP_ECEF), blue
    sequence_poses_topic: "/goal_sequence"           # road_follower's current waypoint window, light blue
    road_path_topic: "/predicted_path_ls"            # path_centerline output (odom_odin), cyan
    intersections_topic: "/intersections"            # osm_cloud crossroads (FP_ENU0), magenta rings
    active_intersection_topic: "/road_follower/active_intersection"   # enter/exit circles
    intersection_enter_threshold: 5.0                # keep equal to road_and_gps_follower.launch
    intersection_exit_threshold: 6.0
    nav_through_poses_feedback_topic: ""
    follow_gps_waypoints_feedback_topic: ""
    follow_waypoints_feedback_topic: ""

osm_cloud:
  ros__parameters:
    grid_topic: "grid"
    intersections_topic: "intersections"
    intersection_markers_topic: "intersection_markers"
